<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Bookings</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',system-ui,Segoe UI,Arial;margin:0;background:#071126;color:#eef3ff}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:rgba(255,255,255,0.03);backdrop-filter:blur(6px)}
.container{padding:20px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.04);text-align:left}
.controls{display:flex;gap:8px;align-items:center}
.btn{background:linear-gradient(90deg,#ffd166,#ff8a1d);border:none;padding:8px 12px;border-radius:8px;color:#111;font-weight:700;cursor:pointer}
.small{font-size:0.9rem;color:#cfe6ff}
.search{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:inherit}
.trash{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:6px;color:#ffd6a6;cursor:pointer}
.empty{padding:40px;text-align:center;color:#99b6d6}
</style>
</head><body>
<div class="header">
  <div>
    <strong style="font-size:1.15rem">Admin Dashboard</strong>
    <div class="small">Bookings management</div>
  </div>
  <div class="controls">
    <input id="q" class="search" placeholder="Search name/from/to" />
    <button id="exportBtn" class="btn">Export CSV</button>
    <a href="/" style="text-decoration:none"><button class="btn">Open Site</button></a>
  </div>
</div>
<div class="container">
  <table class="table" id="ticketsTable">
    <thead><tr><th>When</th><th>Name</th><th>Route</th><th>Time</th><th>Passengers</th><th>Price</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No bookings yet.</div>
</div>
<script>
async function fetchTickets(){
  const res = await fetch('/api/tickets');
  return res.json();
}

function renderRows(items){
  const rows = document.getElementById('rows'); rows.innerHTML='';
  if(!items || items.length===0){ document.getElementById('empty').style.display='block'; return }
  document.getElementById('empty').style.display='none';
  items.forEach(t=>{
    const tr = document.createElement('tr');
    const when = new Date(t.createdAt).toLocaleString();
    tr.innerHTML = `<td>${when}</td><td>${escapeHtml(t.name||'')}</td><td>${escapeHtml(t.from||'')} → ${escapeHtml(t.to||'')}</td><td>${escapeHtml(t.time||'')}</td><td>${t.passengers||1}</td><td>₹${t.price||0}</td><td><button class="trash" onclick="del('${t._id}')">Delete</button></td>`;
    rows.appendChild(tr);
  });
}

async function load(){
  try{
    const items = await fetchTickets();
    window._tickets = items; renderRows(items);
  }catch(e){console.error(e)}
}

async function del(id){
  if(!confirm('Delete this ticket?')) return;
  await fetch('/api/tickets/'+id, { method: 'DELETE' });
  await load();
}

function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

document.getElementById('q').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase();
  const filtered = (window._tickets||[]).filter(t=> (t.name||'').toLowerCase().includes(q) || (t.from||'').toLowerCase().includes(q) || (t.to||'').toLowerCase().includes(q));
  renderRows(filtered);
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const rows = window._tickets||[];
  if(!rows.length) return alert('No bookings');
  const csv = ['id,name,from,to,date,time,passengers,price,createdAt']
    .concat(rows.map(r=>[r._id, r.name, r.from, r.to, r.date, r.time, r.passengers, r.price, r.createdAt].map(x=>`"${(x||'').toString().replace(/"/g,'""')}"`).join(',')) ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'bookings.csv'; document.body.appendChild(a); a.click(); a.remove();
});

load();
</script>
</body></html>
