<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1724"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#071026"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6a5cff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="grain"><feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/><feColorMatrix type="saturate" values="0" in="t" result="t2"/><feBlend in="SourceGraphic" in2="t2" mode="overlay"/></filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />
  <g transform="translate(120,160) scale(1.05)">
    <rect x="0" y="600" width="2000" height="420" rx="40" fill="url(#g2)" opacity="0.06" />
    <g transform="translate(80,420) scale(1)">
      <!-- simple bus silhouette -->
      <rect x="100" y="120" width="1600" height="320" rx="40" fill="#0b1220" stroke="#071026" stroke-width="6" />
      <rect x="220" y="160" width="1200" height="220" rx="20" fill="#0f1b2a" />
      <!-- windows -->
      <g fill="#cfefff" opacity="0.12">
        <rect x="260" y="180" width="180" height="80" rx="10" />
        <rect x="460" y="180" width="180" height="80" rx="10" />
        <rect x="660" y="180" width="180" height="80" rx="10" />
        <rect x="860" y="180" width="180" height="80" rx="10" />
        <rect x="1060" y="180" width="180" height="80" rx="10" />
      </g>
      <!-- wheels -->
      <circle cx="420" cy="480" r="70" fill="#051018" stroke="#0f1724" stroke-width="8" />
      <circle cx="1320" cy="480" r="70" fill="#051018" stroke="#0f1724" stroke-width="8" />
      <circle cx="420" cy="480" r="30" fill="#55606a" />
      <circle cx="1320" cy="480" r="30" fill="#55606a" />
    </g>
  </g>

  <g transform="translate(0,980)">
    <rect x="0" y="0" width="2200" height="420" fill="url(#g2)" opacity="0.03" />
  </g>

</svg>